<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="bench-v2-title">
  <title id="bench-v2-title">Three-Tier Real Before and After Proof: Blind A/B Eval, Concurrent MIT Case Study, and CI Benchmarks</title>

  <rect width="1200" height="660" rx="14" fill="#F6F4EF" stroke="#CFC8BA" stroke-width="1.5"/>

